name: Python unit and regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pull-request code is untrusted. No repository writes, secrets, or privileged
# pull_request_target execution are needed to test synthetic fixtures.
permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install package and test runner
        run: |
          python -m pip install --disable-pip-version-check -e . 'pytest>=8,<9'
          python -m pip check

      - name: Test synthetic fixtures (no external corpus or credentials)
        run: python -m pytest -q tests
