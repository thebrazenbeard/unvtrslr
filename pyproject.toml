[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unvtrslr"
version = "0.1.0"
description = "Reference implementation for measurable cross-system acoustic fingerprints"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.scripts]
unvtrslr-fingerprint = "unvtrslr.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
