schema_version: UNVTRSLR_R0_5_R1_R2_EVALUATION_CONTRACT_V2
status: PROVISIONAL_SPECIFIED_NOT_IMPLEMENTED
supersedes_for_new_work:
  - specs/R1R2_EVALUATION_CONTRACT_V1.yaml
source_base:
  repo: thebrazenbeard/unvtrslr
  commit: 0b3285393ff319f18f40af8c2ba863edea0df2bf
  tree: ca09a38fb082c320335e22272ad17f4ec85be5b4

scope:
  r0_5: identifiability_provenance_and_experiment_integrity_audit
  r1: minimal_semantic_substrate_competition
  r2: adversarial_semantic_grounding_and_claim_qualification

r0_5:
  purpose: >-
    Determine whether the declared learner-accessible surface contains enough
    trustworthy and non-subsidized structure to distinguish the target claim
    from declared rivals, and whether the distinguishing structure can be
    attributed to the coupled system rather than evaluator or instrumentation leakage.
  non_goals:
    - true_meaning_proof
    - communicative_intent_proof
    - universal_semantic_ontology
    - hypothesis_family_completeness_proof
    - hidden_machinery_honesty_inference_from_traces_alone
  required_inputs:
    - interaction_surface
    - target_claim_spec
    - rival_hypothesis_family
    - admissible_strategy_family
    - budget
    - statistical_resolution
    - mediation_trust_partition
    - hypothesis_family_provenance
    - boundary_model
  required_outputs:
    - EMPIRICAL_IDENTIFIABILITY
    - BRIDGE_ATTRIBUTION
    - HYPOTHESIS_FAMILY_STATUS
    - HYPOTHESIS_FAMILY_PROVENANCE
    - WITNESS_PROVENANCE
    - PREPROCESSING_PRESERVATION_STATUS
    - GENERATIVE_PROVENANCE_STATUS
    - BOUNDARY_MODEL
    - CLAIM_CEILING
    - SCOPE
  optional_outputs:
    - TARGET_RELATION_STATUS
  preprocessing_rule:
    id: NO_DESTRUCTIVE_QUOTIENT
    requirement: >-
      Learner-bound transforms may compress, serialize, tokenize, quantize,
      feature-extract, or sample, but must not collapse native learner-accessible
      distinctions required to discriminate a currently admissible rival unless
      the loss is declared and the affected claim is downgraded or marked unidentifiable.
    unknown_status: PREPROCESSING_PRESERVATION_UNKNOWN
  provenance_path_roles:
    - DECLARED_WORLD_DYNAMICS
    - PARTICIPANT_PRODUCED
    - DECLARED_PHYSICAL_OR_CHANNEL_PROPAGATION
    - DECLARED_SENSOR_MODEL
    - LEARNER_PREPROCESSING
    - INSTRUMENTATION_OR_TELEMETRY
    - EVALUATOR_OR_ADJUDICATION
    - UNKNOWN_OR_UNVERIFIED
  fail_closed_statuses:
    - GENERATIVE_PROVENANCE_UNVERIFIED
    - PREPROCESSING_PRESERVATION_UNKNOWN
    - BRIDGE_ATTRIBUTION_UNRESOLVED
    - STRUCTURED_ALTERNATIVE_STRESS_NOT_ESTABLISHED
  hypothesis_family_statuses:
    - REJECTION_ESCAPE_PRESENT
    - REJECTION_ESCAPE_ABSENT
    - STRUCTURED_ALTERNATIVE_STRESS_NOT_ESTABLISHED
    - STRUCTURED_ALTERNATIVE_STRESS_TESTED
    - RIVAL_FAMILY_MISSPECIFICATION_DETECTED
    - BEST_SUPPORTED_AMONG_DECLARED_RIVALS_ONLY
  boundary_model_statuses:
    - EXPERIMENTER_DECLARED
    - LEARNER_DISCOVERED
    - MIXED
    - UNRESOLVED

substrates:
  - id: TPH
    name: Typed Probabilistic Hypergraph
    commitment: explicit_structured_relational_hypotheses
    ontology_prior: high_relative_to_rivals
    native_grounding: evidence_linked_claims
  - id: DCA
    name: Denotational Constraint Algebra
    commitment: executable_constraints_over_compatible_situations_or_trajectories
    ontology_prior: medium_relative_to_rivals
    native_grounding: extensional_denotation_under_context_and_intervention
  - id: PIS
    name: Predictive-Intervention State
    commitment: action_conditioned_predictions_and_signal_induced_predictive_change
    ontology_prior: low_relative_to_rivals
    native_grounding: observable_predictive_and_interventional_consequences

common_candidate_contract:
  required:
    - ingest_observation_by_opaque_reference
    - update_semantic_state
    - preserve_competing_interpretations
    - explicit_uncertainty
    - explicit_provenance
    - condition_on_candidate_signal
    - predict_under_action_or_intervention
    - scoped_equivalence_or_non_equivalence
    - expose_support_and_contradiction
    - evaluator_query_adapter_without_truth_labels
    - conservation_ledger_support
    - UNKNOWN_outcome
    - NO_FAITHFUL_EQUIVALENT_outcome
  prohibited_inputs:
    - evaluator_variable_names
    - evaluator_semantic_labels
    - hidden_shared_object_ids
    - shared_latent_vectors
    - synchronized_episode_identity_side_channels
    - other_agent_internal_state
    - hidden_holdout_configuration
    - undeclared_privileged_instrumentation

complexity_accounting:
  required_fields:
    - serialized_representation_bytes
    - fixed_primitive_count
    - learned_primitive_count
    - candidate_specific_trainable_parameters
    - peak_memory_bytes
    - compute_per_interaction
    - interactions_to_qualification
    - adapter_complexity
    - human_authored_ontology_bytes

trust_zones:
  E0:
    name: evaluator_hidden_truth
    learner_access: forbidden
  E1:
    name: declared_world_sensor_renderer_and_instrumentation
    evaluator_ids_stripped: true
    learner_visible_privileged_telemetry: forbidden_unless_explicitly_in_claimed_surface_and_attributed
  E2:
    name: learner_interaction
    evaluator_truth: forbidden
  E3:
    name: blind_semantic_adjudication
    candidate_training_access: forbidden

harness_sequence:
  - bind_generator_renderer_sensor_and_instrumentation_artifacts
  - deterministic_generator_and_replay
  - r0_5_identifiability_and_provenance_audit
  - positive_oracle_controls
  - required_negative_controls
  - control_acceptance_matrix_check
  - candidate_independent_threshold_calibration
  - freeze_qualification_profile
  - candidate_hidden_evaluation
  - claim_discriminating_followup_where_semantic_promotion_requires_it

critical_tests:
  E01: communication_necessity
  E02: causal_listening
  E03: world_factor_sensitivity
  E04: nuisance_invariance
  E05: novel_instance_grounding
  E06: compositional_recombination
  E07: role_reversal
  E08: cross_task_transfer
  E09: partner_swap_and_third_party_acquisition
  E10: sensor_or_representation_shift
  E11: counterfactual_and_absent_referent
  E12: ontology_mismatch_and_non_equivalence
  E13: independent_semantic_reconstruction
  E14: provenance_and_conservation_audit
  E15: automated_shortcut_search

stable_adversarial_controls:
  - CTRL_PRIVATE_ALIAS
  - CTRL_MINIMAL_SEPARABLE
  - CTRL_BRIDGE_ORACLE
  - CTRL_RAW_SCENE_ORACLE
  - CTRL_GLOBAL_STATE_WATERMARK
  - CTRL_DESTRUCTIVE_QUOTIENT
  - CTRL_POSTHOC_SEMANTIC_NAMING
  - CTRL_IID_HOLDOUT_ILLUSION
  - CTRL_STRUCTURED_RIVAL_ADEQUACY
  - CTRL_SEMANTIC_NULL_CONTENT

negative_controls_legacy:
  - N00_random_communicator
  - N01_silent_competent_receiver
  - N02_correlated_noncausal_signaler
  - N03_episode_id_code
  - N04_shared_latent_leak
  - N05_lookup_memorizer
  - N06_private_pair_codebook
  - N07_action_plan_code
  - N08_receiver_policy_index
  - N09_reward_side_channel
  - N10_serialization_artifact_code
  - N11_coordinate_frame_shortcut
  - N12_message_length_or_timing_leak
  - N13_forced_translator
  - N14_english_concept_probe_leak
  - N15_shared_pretrained_ontology
  - N16_context_shuffler
  - N17_correlation_as_causation
  - N18_overfit_denotation_table
  - N19_opaque_predictive_task_specialist
  - N20_sender_only_labeler
  - N21_receiver_hallucinated_semantics
  - N22_identity_specific_convention
  - N23_evaluation_language_mimic
  - N24_conservation_liar

positive_controls:
  - P00_evaluator_oracle
  - P01_grounded_arbitrary_convention_oracle
  - P02_partial_equivalence_oracle
  - P03_calibrated_uncertain_oracle

operational_grounding_vector:
  - COMMUNICATION_CAUSALITY
  - WORLD_GROUNDING
  - NUISANCE_INVARIANCE
  - NOVEL_INSTANCE_GENERALIZATION
  - COMPOSITION
  - ROLE_SYMMETRY
  - CROSS_TASK_TRANSFER
  - PARTNER_TRANSFER
  - SENSOR_SHIFT_TRANSFER
  - COUNTERFACTUAL_VALIDITY
  - NON_EQUIVALENCE_CALIBRATION
  - UNCERTAINTY_CALIBRATION
  - PROVENANCE_INTEGRITY
  - SEMANTIC_CONSERVATION
  - SHORTCUT_RESISTANCE

r2_claim_qualification:
  informational_relation_statuses:
    - INFORMATIONAL_RELATION_SUPPORTED
    - RECEIVER_USE_SUPPORTED
    - COMMUNICATIVE_FUNCTION_SUPPORTED_IN_SCOPE
    - COMMUNICATIVE_FUNCTION_UNRESOLVED
    - NONCOMMUNICATIVE_CUE_SUPPORTED
  interpretation_statuses:
    - CONFIRMATORY_TARGET_CLAIM
    - EXPLORATORY_POST_HOC_INTERPRETATION
    - OPERATIONAL_RELATION_VERIFIED_SEMANTIC_NAMING_UNRESOLVED
    - POST_HOC_INTERPRETATION_RETESTED_ON_FRESH_EVIDENCE
  evidence_discrimination_statuses:
    - FRESH_BUT_NONDISCRIMINATING_EVIDENCE
    - CLAIM_DISCRIMINATING_HOLDOUT
    - COUNTERFACTUAL_OR_SHIFT_TESTED
    - SEMANTIC_INTERPRETATION_STILL_CONFOUNDED
  semantic_delta_statuses:
    - OPERATIONAL_CORRESPONDENCE_ESTABLISHED
    - SEMANTIC_DELTA_SPECIFIED
    - SEMANTIC_DELTA_TESTED
    - SEMANTIC_DELTA_NOT_ESTABLISHED
    - SEMANTIC_INTERPRETATION_UNDERDETERMINED_IN_SCOPE
    - SEMANTIC_LABEL_ADDS_NO_FALSIFIABLE_CONTENT
  semantic_surplus_obligation:
    required_for_stronger_semantic_promotion: true
    requirement: >-
      A stronger semantic claim must declare at least one predeclared condition
      under which the lower operational claim may remain true while the stronger
      semantic claim becomes false.
    anti_circularity: >-
      Passing an evaluator suite does not by itself define semantics. The surplus
      obligation must be independently justified for the exact claim and must not
      be arbitrary extra difficulty that an equally non-semantic operational code
      can satisfy for the same reason.
    statuses:
      - NOT_APPLICABLE_LOWER_OPERATIONAL_CLAIM
      - DECLARED_AND_TESTABLE
      - TESTED_AND_SURVIVED
      - FAILED
      - NO_DISTINCT_FALSIFIABLE_BURDEN_IDENTIFIED

threshold_policy:
  candidate_hidden_results_may_set_thresholds: false
  calibration_sources:
    - chance_or_null_controls
    - positive_oracles
    - negative_controls
    - harness_only_pilot_worlds
  freeze_before_candidate_hidden_evaluation: true
  normalized_metric: "(candidate - null) / (oracle - null), direction-adjusted for losses"
  each_critical_metric_requires:
    - preregistered_minimum_oracle_headroom
    - preregistered_margin_over_strongest_applicable_negative_control
    - preregistered_confidence_interval_method
    - preregistered_minimum_episode_count
  aggregate_score_can_override_critical_failure: false

certificate:
  schema_version: UNVTRSLR_SCOPED_GROUNDING_CERTIFICATE_V2
  allowed_statuses:
    - FAIL
    - HARNESS_INVALID
    - OPERATIONAL_RELATION_VERIFIED
    - GROUNDED_WITHIN_TESTED_SCOPE
    - SEMANTIC_CORRESPONDENCE_WITHIN_TESTED_SCOPE
    - PARTIALLY_GROUNDED
    - INDETERMINATE
  forbidden_statuses:
    - UNIVERSALLY_GROUNDED
    - TRUE_MEANING_RECOVERED
  required_bindings:
    - candidate_substrate_version
    - learner_code_digest
    - evaluator_code_digest
    - world_generator_digest
    - renderer_and_sensor_digests
    - instrumentation_digests
    - qualification_profile_digest
    - training_configuration_digest
    - channel_configuration_digest
    - stable_control_suite_version
    - hidden_holdout_generation_rule_digest
    - claim_discriminating_followup_rule_digest_where_required
    - seed_or_seed_rule_commitment
    - hypothesis_family_provenance
    - witness_provenance
    - generative_provenance_status
    - boundary_model
    - structured_alternative_stress_status
    - semantic_surplus_obligation_status_for_semantic_claims
    - metric_vector_with_confidence_intervals
    - critical_test_results
    - surviving_alternative_explanations
    - scope_limitations

r1_decision_rule:
  winner_required: false
  pareto_nondominated_candidates_may_survive: true
  richer_candidate_must_earn_complexity: true
  dominated_if:
    - rival_passes_all_critical_tests_candidate_passes
    - rival_is_noninferior_on_preregistered_semantic_metrics
    - rival_is_strictly_simpler_on_at_least_one_material_dimension_without_material_regression

claims_boundary:
  arbitrary_symbol_permutation_is_failure: false
  task_bound_private_shortcut_is_failure: true
  passing_r0_5_is_semantic_success: false
  passing_r1_is_semantic_success: false
  passing_r2_is_metaphysical_proof_of_meaning: false
  passing_r2_is_scoped_operational_or_semantic_evidence_according_to_certificate: true
  null_rival_presence_establishes_family_completeness: false
  fresh_iid_holdout_is_automatically_claim_discriminating: false
  target_independent_instrumentation_is_automatically_neutral: false
